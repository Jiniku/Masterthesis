[project]
name = "quizgen"
version = "0.2.0"
description = "Automated Test Assembly — select blueprint-compliant exams from a question bank. Master's thesis, KWARC group, FAU Erlangen-Nürnberg"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jinikuhayashi" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Optional: semantic (embedding) deduplication. Without it, dedup falls back
# to a dependency-free token-overlap measure.
embeddings = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quizgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pulp.*",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
