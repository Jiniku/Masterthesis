[project]
name = "quizgen"
version = "0.1.0"
description = "LLM-powered exam/quiz generator from textbooks — Master's thesis, KWARC group, FAU Erlangen-Nürnberg"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jinikuhayashi" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.30,<2",
    "python-dotenv>=1.0,<2",
    "tiktoken>=0.7,<1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Phase 2+
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
# Phase 4+
assembly = [
    "pulp>=2.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quizgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pulp.*",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
